name: 🚀 Deploy website on push

on: push

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Install dependencies
        uses: actions/set-up/node@v2
        with:
          node-version: '14'
      - name: 📂 Install npm dependencies
        run: npm install

      - name: 📂 Sync files via FTPS
        env:
          FTP_PASSWORD: ${{ secrets.ftp_password }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set ftp:ssl-allow true;
            set ftp:ssl-protect-data true;
            set net:timeout 15;
            set net:max-retries 3;
            open -u quai-antique,$FTP_PASSWORD ftp-quai-antique.alwaysdata.net;
            mirror --reverse --delete --verbose \
              --exclude-glob .git/ \
              --exclude-glob .git/** \
              --exclude-glob node_modules/bootstrap/scss/** \
              --exclude-glob node_modules/bootstrap/js/** \
              --exclude-glob node_modules/bootstrap-icons/icons/** \
              ./ ./www/
          "
