name: 🚀 Deploy website on push

on: push

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTPS
        uses: airvzxf/ftp-action@v1.0.8
        with:
          server: ftp-quai-antique.alwaysdata.net
          user: quai-antique
          password: ${{ secrets.ftp_password }}
          local_dir: ./
          remote_dir: ./www/
          options: >-
            --exclude .git/
            --exclude node_modules/bootstrap/scss/
            --exclude node_modules/bootstrap/js/
            --exclude node_modules/bootstrap-icons/icons/
